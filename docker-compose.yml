services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    container_name: changedetection
    hostname: changedetection
    volumes:
      # Bind mount (not a named volume) so the datastore is inspectable/backupable
      # directly on disk. Lives in this repo clone (already .gitignore'd via
      # `datastore/`), NOT in the OneDrive vault, to avoid OneDrive's file-sync
      # locking fighting with changedetection's frequent on-disk writes.
      - ./datastore:/datastore
# Configurable proxy list support, see https://github.com/dgtlmoon/changedetection.io/wiki/Proxy-configuration#proxy-list-support
#      - ./proxies.json:/datastore/proxies.json
    environment:
      #   Sockpuppetbrowser gives changedetection a real Chrome instance over the
      #   "playwright" protocol for JS-rendered pages (screenshots, Visual Selector).
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
      #
      #   Log levels are in descending order. (TRACE is the most detailed one)
      #   Log output levels: TRACE, DEBUG(default), INFO, SUCCESS, WARNING, ERROR, CRITICAL
      # - LOGGER_LEVEL=TRACE
      #
      #   Plugins! See https://changedetection.io/plugins for more plugins.
      # - EXTRA_PACKAGES=changedetection.io-osint-processor
      #
      #   Alternative WebDriver/selenium URL (deprecated path, not used here)
      # - WEBDRIVER_URL=http://browser-selenium-chrome:4444/wd/hub
      #
      #   Base URL of your changedetection.io install (added to notification alerts)
      # - BASE_URL=https://mysite.com
      #
      #   Hides the `Referer` header so monitored sites can't see the changedetection.io hostname.
      # - HIDE_REFERER=true
      #
      #   Absolute minimum seconds to recheck, overrides any watch minimum, change to 0 to disable
      # - MINIMUM_SECONDS_RECHECK_TIME=3
      #
      #   For complete privacy if you don't want to use the 'check version' / telemetry service
      # - DISABLE_VERSION_CHECK=true
      #
      #   Disable all LLM / AI features, prompts etc — leave unset/false, we want this on.
      # - LLM_FEATURES_DISABLED=true
      #
      #   LLM relevance filtering — model via litellm's "anthropic/<model-id>" convention.
      #   Key comes from a .env file (gitignored) via ${ANTHROPIC_API_KEY}, not hardcoded
      #   here, since this file is tracked in the fork. Create ./.env with a line:
      #     ANTHROPIC_API_KEY=sk-ant-...
      - LLM_MODEL=anthropic/claude-haiku-4-5-20251001
      - LLM_API_KEY=${ANTHROPIC_API_KEY}
      #
      #   A valid timezone name, see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      # - TZ=America/Los_Angeles
    ports:
      - 127.0.0.1:5000:5000
    restart: unless-stopped
    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started

  # Sockpuppetbrowser is basically chrome wrapped in an API for allowing fast fetching of web-pages.
  # RECOMMENDED FOR FETCHING PAGES WITH CHROME, be sure PLAYWRIGHT_DRIVER_URL above points here.
  browser-sockpuppet-chrome:
    hostname: browser-sockpuppet-chrome
    image: dgtlmoon/sockpuppetbrowser:latest
    cap_add:
      - SYS_ADMIN
      # SYS_ADMIN is needed for Chrome's sandbox to run inside the container.
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10

  # Left disabled — deprecated path for this app (no status codes, worse screenshot
  # support than sockpuppet). Kept for reference only.
  # browser-selenium-chrome:
  #   hostname: browser-selenium-chrome
  #   image: selenium/standalone-chrome:4
  #   environment:
  #     - VNC_NO_PASSWORD=1
  #     - SCREEN_WIDTH=1920
  #     - SCREEN_HEIGHT=1080
  #     - SCREEN_DEPTH=24
  #   volumes:
  #     - /dev/shm:/dev/shm
  #   restart: unless-stopped
